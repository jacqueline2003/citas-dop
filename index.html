function getSessionLabel(firstDate, targetDate, reagendadas, asuetoDates) {
  var first = new Date(firstDate + "T12:00:00");
  var target = new Date(targetDate + "T12:00:00");
  var diff = Math.round((target - first) / (7 * 24 * 60 * 60 * 1000));
  if (isNaN(diff) || diff < 0) return "PRE";
  var reag = parseInt(reagendadas) || 0;
  var asuSkip = 0;
  if (asuetoDates && asuetoDates.length > 0) {
    var dayOfWeek = first.getDay();
    asuetoDates.forEach(function(ad) {
      var aDate = new Date(ad + "T12:00:00");
      if (aDate.getDay() === dayOfWeek && aDate >= first && aDate < target) {
        asuSkip++;
      }
    });
  }
  var adjusted = diff - reag - asuSkip;
  if (isNaN(adjusted) || adjusted <= 0) return "PRE";
  return "S" + adjusted;
}

function getWeekDates(mondayStr) {
  var dates = [];
  var d = new Date(mondayStr + "T12:00:00");

    dates.push(d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0"));

  }

  const o = { ...s };
  if (!o[day]) o[day] = [];
  if (o[day].includes(hour)) {
    o[day] = o[day].filter(function(h) { return h !== hour; });

    o[day] = [...o[day], hour].sort(function(a, b) { return parseInt(a) - parseInt(b); });

}

/* ── SHA-256 + Password Gate ── */

async function sha256(msg) {
  var buf = new TextEncoder().encode(msg);
  var hash = await crypto.subtle.digest("SHA-256", buf);
  return Array.from(new Uint8Array(hash)).map(function(b) { return b.toString(16).padStart(2, "0"); }).join("");
}

function PasswordGate({ children }) {
  const [authed, setAuthed] = useState(false);
  const [pw, setPw] = useState("");
  const [pw2, setPw2] = useState("");
  const [error, setError] = useState("");
  const [isSetup, setIsSetup] = useState(null);
  const [checking, setChecking] = useState(true);

  useEffect(function() {
    try {
      if (sessionStorage.getItem("dop-auth") === "ok") {
        setAuthed(true);
        setChecking(false);
        return;
      }
    } catch(e) {}

    if (window._firestoreDb) {
      window._firestoreDb.doc("config/auth").get().then(function(snap) {
        if (snap.exists && snap.data().hash) {
          setIsSetup(true);
        } else {
          setIsSetup(false);
        }
        setChecking(false);
      }).catch(function() {
        setIsSetup(false);
        setChecking(false);
      });
    } else {
      try {
        var h = localStorage.getItem("dop-pw-hash");
        setIsSetup(!!h);
      } catch(e) { setIsSetup(false); }
      setChecking(false);
    }
  }, []);

  async function handleLogin(e) {
    e.preventDefault();
    setError("");
    var hash = await sha256(pw);

    if (window._firestoreDb) {
      try {
        var snap = await window._firestoreDb.doc("config/auth").get();
        if (snap.exists && snap.data().hash === hash) {
          setAuthed(true);
          try { sessionStorage.setItem("dop-auth", "ok"); } catch(x) {}
        } else {
          setError("Contrase\u00f1a incorrecta");
        }
      } catch(ex) {
        setError("Error de conexi\u00f3n: " + ex.message);
      }
    } else {
      try {
        var stored = localStorage.getItem("dop-pw-hash");
        if (stored === hash) {
          setAuthed(true);
          try { sessionStorage.setItem("dop-auth", "ok"); } catch(x) {}
        } else {
          setError("Contrase\u00f1a incorrecta");
        }
      } catch(ex) {
        setError("Error: " + ex.message);
      }
    }
  }

  async function handleSetup(e) {
    e.preventDefault();
    setError("");
    if (pw.length < 4) { setError("M\u00ednimo 4 caracteres"); return; }
    if (pw !== pw2) { setError("Las contrase\u00f1as no coinciden"); return; }
    var hash = await sha256(pw);

    if (window._firestoreDb) {
      try {
        await window._firestoreDb.doc("config/auth").set({ hash: hash });
        setAuthed(true);
        try { sessionStorage.setItem("dop-auth", "ok"); } catch(x) {}
      } catch(ex) {
        setError("Error al guardar: " + ex.message);
      }
    } else {
      try {
        localStorage.setItem("dop-pw-hash", hash);
        setAuthed(true);
        try { sessionStorage.setItem("dop-auth", "ok"); } catch(x) {}
      } catch(ex) {
        setError("Error: " + ex.message);
      }
    }
  }

  if (authed) return children;

  if (checking) {
    return (
      <div className="min-h-screen flex items-center justify-center" style={{ background: "linear-gradient(135deg, #1F2A5C, #2d3a7c)" }}>
        <p className="text-white text-lg">Cargando...</p>
      </div>
    );
  }

  return (
    <div className="min-h-screen flex items-center justify-center p-4" style={{ background: "linear-gradient(135deg, #1F2A5C, #2d3a7c)" }}>
      <div className="bg-white rounded-2xl shadow-2xl max-w-sm w-full p-8">
        <div className="text-center mb-6">
          <div className="w-16 h-16 mx-auto mb-3 rounded-full flex items-center justify-center" style={{ background: "#1F2A5C" }}>
            <span className="text-white text-2xl">{isSetup ? "\uD83D\uDD12" : "\uD83D\uDD11"}</span>
          </div>
          <h2 className="text-xl font-bold" style={{ color: "#1F2A5C" }}>Sistema de Citas DOP</h2>
          <p className="text-sm text-gray-500 mt-1">
            {isSetup ? "Ingresa tu contrase\u00f1a para acceder" : "Crea una contrase\u00f1a para proteger el sistema"}
          </p>
        </div>
        <form onSubmit={isSetup ? handleLogin : handleSetup}>
          <input type="password" value={pw} onChange={function(e) { setPw(e.target.value); }}
            className="w-full border border-gray-300 rounded-lg p-3 mb-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
            placeholder={isSetup ? "Contrase\u00f1a" : "Nueva contrase\u00f1a"} autoFocus />
          {!isSetup && (
            <input type="password" value={pw2} onChange={function(e) { setPw2(e.target.value); }}
              className="w-full border border-gray-300 rounded-lg p-3 mb-3 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500"
              placeholder="Confirmar contraseña" />
          )}
          {error && <p className="text-red-500 text-sm mb-3 text-center">{error}</p>}
          <button type="submit"
            className="w-full text-white rounded-lg p-3 font-semibold text-sm cursor-pointer hover:opacity-90 transition"
            style={{ background: "#1F2A5C" }}>
            {isSetup ? "Entrar" : "Crear contrase\u00f1a y entrar"}
          </button>
        </form>
        <p className="text-xs text-gray-400 text-center mt-4">FCFM-UANL · Departamento de Orientación Psicopedagógica</p>
      </div>
    </div>
  );
}

function Modal({ open, onClose, title, children, wide }) {

        </div>
        <div className="p-4">{children}</div>
      </div>
    </div>
  );
}

function Toast({ msg, onDone }) {
  useEffect(function() {
    if (msg) {
      const t = setTimeout(onDone, 2200);
      return function() { clearTimeout(t); };
    }
  }, [msg, onDone]);
  if (!msg) return null;
  return (
    <div className="fixed bottom-6 left-1/2 -translate-x-1/2 z-50 bg-emerald-600 text-white px-5 py-3 rounded-lg shadow-lg text-sm font-medium">
      {msg}
    </div>
  );
}

function copyText(text) {
  try {
    var textarea = document.createElement("textarea");
    textarea.value = text;
    textarea.style.position = "fixed";
    textarea.style.left = "-9999px";
    textarea.style.top = "-9999px";
    textarea.style.opacity = "0";
    document.body.appendChild(textarea);
    textarea.focus();
    textarea.select();
    document.execCommand("copy");
    document.body.removeChild(textarea);
    return true;
  } catch (e) {
    try {
      navigator.clipboard.writeText(text);
      return true;
    } catch (e2) {
      return false;
    }
  }
}

function CopyBtn({ text, label }) {
  const [ok, setOk] = useState(false);
  const btnLabel = label || "Copiar";
  function handleCopy() {
    var success = copyText(text);
    if (success) {
      setOk(true);
      setTimeout(function() { setOk(false); }, 1500);
    }
  }
  return (
    <button
      onClick={handleCopy}
      className="px-3 py-1.5 rounded text-xs font-medium cursor-pointer shrink-0 text-white"
      style={{ background: ok ? "#059669" : "#1F2A5C" }}
    >
      {ok ? "✓ Copiado" : btnLabel}
    </button>
  );
}

function ConfirmBtn({ onConfirm, label, confirmLabel }) {
  const [pending, setPending] = useState(false);
  useEffect(function() {
    if (pending) {
      var t = setTimeout(function() { setPending(false); }, 3000);
      return function() { clearTimeout(t); };
    }
  }, [pending]);
  function handleClick() {
    if (pending) {
      setPending(false);
      onConfirm();
    } else {
      setPending(true);
    }
  }
  return (
    <button
      onClick={handleClick}
      className={"px-3 py-1.5 text-xs rounded border cursor-pointer " + (pending ? "border-red-500 bg-red-500 text-white" : "border-red-200 text-red-600 hover:bg-red-50")}
    >
      {pending ? (confirmLabel || "¿Seguro?") : label}
    </button>
  );
}

function AsignarTab({ data, onSave, toast }) {
  const [selAl, setSelAl] = useState("");
  const [modal, setModal] = useState(null);
  const [selPr, setSelPr] = useState("");
  const [firstDate, setFirstDate] = useState("");

  var alumno = data.alumnos.find(function(a) { return a.id === selAl; });
  var existing = alumno ? data.citas.find(function(c) { return c.alumnoId === alumno.id && c.active; }) : null;

  function findConflicts(pracId, day, hour) {
    return data.bloqueos.filter(function(b) {
      if (!b.pIds.includes(pracId)) return false;
      if (b.hour !== hour) return false;
      return dateToDay(b.date) === day;
    });
  }

  function wouldExceed2Consecutive(pracId, day, newHour) {
    var existing = data.citas
      .filter(function(c) { return c.active && c.practicanteId === pracId && c.day === day; })
      .map(function(c) { return parseInt(c.hour); });
    var all = existing.concat([parseInt(newHour)]);
    all.sort(function(a, b) { return a - b; });
    var run = 1;
    for (var i = 1; i < all.length; i++) {
      if (all[i] === all[i - 1] + 1) {
        run++;
        if (run > 2) return true;
      } else {
        run = 1;
      }
    }
    return false;
  }

  var slotInfo = useMemo(function() {
    if (!alumno) return {};
    var info = {};
    DAYS.forEach(function(d) {
      info[d] = {};
      HOURS.forEach(function(h) {
        var hasClass = alumno.clases[d] && alumno.clases[d].includes(h);
        /* Count only non-propiaOficina citas against shared offices */
        var citasShared = data.citas.filter(function(c) {
          if (!c.active || c.day !== d || c.hour !== h) return false;
          var pr = data.practicantes.find(function(p) { return p.id === c.practicanteId; });
          return pr && !pr.propiaOficina;
        }).length;
        var oficinas = MAX_OFICINAS - citasShared;

        var pracs = data.practicantes.filter(function(p) {
          var inSched = p.schedule[d] && p.schedule[d].includes(h);
          var busy = data.citas.some(function(c) { return c.active && c.practicanteId === p.id && c.day === d && c.hour === h; });
          var tooMany = wouldExceed2Consecutive(p.id, d, h);
          /* Practicantes with own office are always available (no office limit) */
          /* Regular practicantes need a shared office available */
          if (p.propiaOficina) {
            return inSched && !busy && !tooMany;
          }
          return inSched && !busy && !tooMany && oficinas > 0;
        }).map(function(p) {
          return { ...p, conflicts: findConflicts(p.id, d, h) };
        });
        info[d][h] = { hasClass: hasClass, oficinas: oficinas, pracs: pracs, citasShared: citasShared };
      });
    });
    return info;
  }, [alumno, data]);

  function assign() {
    if (!modal || !firstDate) return;
    var pracId = selPr || (modal.pracs.length === 1 ? modal.pracs[0].id : "");
    if (!pracId) return;
    var cita = { id: uid(), alumnoId: selAl, practicanteId: pracId, day: modal.day, hour: modal.hour, firstDate: firstDate, active: true };
    onSave({ ...data, citas: data.citas.concat([cita]) });
    toast("✓ Cita asignada");
    setModal(null);
    setSelPr("");
    setFirstDate("");
  }

  /* Exclude students with terminal status */
  var terminados = {};
  data.citas.forEach(function(c) {
    if (!c.active && (c.status === "alta" || c.status === "baja_manual" || c.status === "baja_faltas" || c.status === "canalizada")) {
      terminados[c.alumnoId] = c.status;
    }
  });
  /* If student has an active cita, they're NOT terminated */
  data.citas.forEach(function(c) {
    if (c.active && terminados[c.alumnoId]) {
      delete terminados[c.alumnoId];
    }
  });

  var alumnosDisponibles = data.alumnos.filter(function(a) { return !terminados[a.id]; });
  var sinCita = alumnosDisponibles.filter(function(a) { return !data.citas.some(function(c) { return c.alumnoId === a.id && c.active; }); });
  var conCita = alumnosDisponibles.filter(function(a) { return data.citas.some(function(c) { return c.alumnoId === a.id && c.active; }); });

  var modalPracId = modal ? (selPr || (modal.pracs.length === 1 ? modal.pracs[0].id : "")) : "";
  var modalPrac = modal ? modal.pracs.find(function(p) { return p.id === modalPracId; }) : null;

  function renderSlotCell(d, h) {
    var s = slotInfo[d] && slotInfo[d][h];
    if (!s) return <td key={d} className="border border-gray-300"></td>;

    if (s.hasClass) {
      return <td key={d} className="border border-gray-300 bg-red-50 text-center text-red-400 p-1 text-xs">En clase</td>;

    }

    var regularPracs = s.pracs.filter(function(p) { return !p.propiaOficina; });
    var karlaAvail = s.pracs.find(function(p) { return p.propiaOficina; });
    var hasConf = s.pracs.some(function(p) { return p.conflicts.length > 0; });
    var bgClass = hasConf ? "bg-amber-50 hover:bg-amber-100" : "bg-emerald-50 hover:bg-emerald-100";
    var textClass = hasConf ? "text-amber-700" : "text-emerald-700";
    var pracNames = regularPracs.map(function(p) { return p.name.split(" ")[0]; }).join(", ");

    return (
      <td key={d} className={"border border-gray-300 p-1 cursor-pointer " + bgClass}

          {regularPracs.length > 0 && <p className={"font-medium " + textClass}>{s.oficinas} ofic.</p>}

          {karlaAvail && <p className="text-purple-600 font-medium" style={{ fontSize: 10 }}>★ Karla</p>}

  return (

            </div>

            <div>
              <label className="block text-sm font-medium text-gray-700 mb-1">Practicante</label>
              {modal.pracs.length === 1 ? (
                <p className="text-sm font-medium" style={{ color: "#1F2A5C" }}>{modal.pracs[0].name}{modal.pracs[0].propiaOficina ? " (oficina propia)" : ""}</p>

                  <option value="">Elegir...</option>
                  {modal.pracs.map(function(p) {
                    var oficTxt = p.propiaOficina ? " ★ oficina propia" : "";

                    return <option key={p.id} value={p.id}>{p.name}{oficTxt}{confTxt}</option>;

            </div>

            {modalPrac && modalPrac.conflicts.length > 0 && (
              <div className="p-3 rounded-lg bg-amber-50 border border-amber-200 text-sm">
                <p className="font-medium text-amber-800 mb-2">⚠️ {modalPrac.name} tiene {modalPrac.conflicts.length} fecha(s) con conflicto:</p>
                {modalPrac.conflicts.map(function(c) {
                  var dt = new Date(c.date + "T12:00:00");

                  return <p key={c.id} className="text-xs text-amber-700 mb-1">• {fmtDateES(c.date)} ({dt.getDate()}/{dt.getMonth() + 1}) — {icon} {c.name}{c.session ? " (" + c.session + ")" : ""}</p>;

              <input type="date" value={firstDate} onChange={function(e) { setFirstDate(e.target.value); }} className="w-full border border-gray-300 rounded-lg px-3 py-2 text-sm" />
              {firstDate && <p className="text-xs text-gray-500 mt-1">Primera cita: {fmtDateES(firstDate)} a las {fmtH12(modal.hour)}</p>}
            </div>

            <div className="flex justify-end gap-3 pt-3 border-t">
              <button onClick={function() { setModal(null); }} className="px-4 py-2 rounded-lg text-sm text-gray-600 hover:bg-gray-100 cursor-pointer">Cancelar</button>
              <button onClick={assign} className="px-5 py-2 rounded-lg text-white text-sm font-medium cursor-pointer" style={{ background: "#B22222" }}>Asignar cita</button>
            </div>

        )}
      </Modal>
    </div>
  );
}

function getWeeklyDates(firstDate, count) {
  var dates = [];
  var d = new Date(firstDate + "T12:00:00");
  for (var i = 0; i < count; i++) {
    var iso = d.getFullYear() + "-" + String(d.getMonth() + 1).padStart(2, "0") + "-" + String(d.getDate()).padStart(2, "0");
    dates.push(iso);
    d.setDate(d.getDate() + 7);
  }
  return dates;
}

function findCitaConflicts(cita, bloqueos) {
  var dates = getWeeklyDates(cita.firstDate, 16);
  var conflicts = [];
  dates.forEach(function(dateStr, i) {
    var dayName = dateToDay(dateStr);
    var matching = bloqueos.filter(function(b) {
      return b.pIds.includes(cita.practicanteId) && b.date === dateStr && b.hour === cita.hour;
    });
    if (matching.length === 0) {
      matching = bloqueos.filter(function(b) {
        return b.pIds.includes(cita.practicanteId) && b.hour === cita.hour && dateToDay(b.date) === dayName && b.date === dateStr;
      });
    }
    if (matching.length > 0) {
      var nextDate = i + 1 < dates.length ? dates[i + 1] : null;
      conflicts.push({ date: dateStr, week: i, bloqueo: matching[0], nextDate: nextDate });
    }
  });
  return conflicts;
}

function CitasTab({ data, onSave, toast }) {
  const [msgModal, setMsgModal] = useState(null);
  const [op2Fecha, setOp2Fecha] = useState("");
  const [op2Hora, setOp2Hora] = useState("");
  const [faltaModal, setFaltaModal] = useState(null);
  const [view, setView] = useState("list");
  const [search, setSearch] = useState("");
  const [bajaModal, setBajaModal] = useState(null);
  const [bajaStatus, setBajaStatus] = useState("baja_manual");
  const [reagendarModal, setReagendarModal] = useState(null);
  const [reagendarMotivo, setReagendarMotivo] = useState("alumno");
  const [reagendarFecha, setReagendarFecha] = useState("");
  const [citaAccion, setCitaAccion] = useState(null);

  var active = data.citas.filter(function(c) { return c.active; });
  var sorted = active.slice().sort(function(a, b) {
    var di = DAYS.indexOf(a.day) - DAYS.indexOf(b.day);
    return di !== 0 ? di : parseInt(a.hour) - parseInt(b.hour);
  });

  var filtered = sorted.filter(function(c) {
    if (!search) return true;
    var q = search.toLowerCase();
    var al = data.alumnos.find(function(a) { return a.id === c.alumnoId; });
    var pr = data.practicantes.find(function(p) { return p.id === c.practicanteId; });
    return (al && (al.name.toLowerCase().includes(q) || al.matricula.includes(q))) || (pr && pr.name.toLowerCase().includes(q));
  });

  function deactivateWithStatus(id, status) {
    onSave({ ...data, citas: data.citas.map(function(c) {
      if (c.id !== id) return c;
      return { ...c, active: false, status: status };
    }) });
    var labels = { baja_manual: "Baja manual", alta: "Alta", canalizada: "Canalización", baja_faltas: "Baja por faltas" };
    toast((labels[status] || "Baja") + " registrada");
    setBajaModal(null);
  }

  function registrarFalta(citaId) {
    var cita = data.citas.find(function(c) { return c.id === citaId; });
    if (!cita) return;
    var newFaltas = (cita.faltas || 0) + 1;
    var updatedCitas = data.citas.map(function(c) {
      if (c.id !== citaId) return c;
      if (newFaltas >= 3) return { ...c, faltas: newFaltas, active: false, status: "baja_faltas" };
      return { ...c, faltas: newFaltas };
    });
    onSave({ ...data, citas: updatedCitas });
    if (newFaltas >= 3) { toast("3 faltas — baja automática"); } else { toast("Falta #" + newFaltas + " registrada"); }
  }

  function quitarFalta(citaId) {
    onSave({ ...data, citas: data.citas.map(function(c) {
      if (c.id !== citaId) return c;
      return { ...c, faltas: Math.max(0, (c.faltas || 0) - 1) };
    }) });
    toast("Falta removida");
  }

  function reagendar(citaId, fechaReagendada) {
    onSave({ ...data, citas: data.citas.map(function(c) {
      if (c.id !== citaId) return c;
      var arr = Array.isArray(c.reagendadas) ? c.reagendadas.slice() : [];
      if (fechaReagendada && !arr.includes(fechaReagendada)) {
        arr.push(fechaReagendada);
      }
      return { ...c, reagendadas: arr };
    }) });
    toast("Sesión reagendada");
    setReagendarModal(null);
    setReagendarFecha("");
  }

  function getReagendadasCount(cita) {
    if (Array.isArray(cita.reagendadas)) return cita.reagendadas.length;
    if (typeof cita.reagendadas === "number") return cita.reagendadas;
    return 0;
  }

  function isReagendada(cita, dateStr) {
    if (Array.isArray(cita.reagendadas)) return cita.reagendadas.includes(dateStr);
    return false;
  }

  function genPracTitle(c, dateStr) {
    var pr = data.practicantes.find(function(p) { return p.id === c.practicanteId; });
    if (!pr) return "";
    return pr.name + " - " + fmtDateES(dateStr || c.firstDate) + " - " + fmtH12(c.hour);
  }

  function genPracBody(c) {
    var al = data.alumnos.find(function(a) { return a.id === c.alumnoId; });
    if (!al) return "";
    return "Nombre: " + al.name + "\nMatrícula: " + al.matricula + "\nCarrera: " + al.carrera + "\nMotivo de consulta: " + al.motivoConsulta + (al.enLinea ? "\nModalidad: En línea" : "");
  }

  /* Agenda semanal */
  const [agendaModal, setAgendaModal] = useState(false);
  const [agendaPrac, setAgendaPrac] = useState("");

  /* Calendario visual */
  const [calModal, setCalModal] = useState(false);
  const [calMonday, setCalMonday] = useState("");

  function buildCalItems(weekDates, activeCitas, dt) {
    var grid = {};
    var usedHours = {};
    var asuetos = dt.asuetos || [];
    HOURS.forEach(function(h) { grid[h] = []; });

    weekDates.forEach(function(dateStr, dayIdx) {
      var dayName = DAYS[dayIdx];
      var calDate = new Date(dateStr + "T12:00:00");

      /* Check if this day is an asueto */
      var asueto = asuetos.find(function(a) { return a.date === dateStr; });
      if (asueto) {
        grid["9:00"].push({ dayIdx: dayIdx, label: "ASUETO: " + asueto.name, color: { bg: "#B22222", text: "#fff" }, type: "asueto" });
        usedHours["9:00"] = true;
        return;
      }

      HOURS.forEach(function(h) {
        var citasHere = activeCitas.filter(function(c) {
          if (c.day !== dayName || c.hour !== h) return false;
          var startDate = new Date(c.firstDate + "T12:00:00");
          return startDate <= calDate;
        });
        citasHere.forEach(function(c) {
          var al = dt.alumnos.find(function(a) { return a.id === c.alumnoId; });
          var initials = al ? getInitials(al.name) : "??";

          /* Check if this specific date was reagendada */
          var wasReag = false;
          if (Array.isArray(c.reagendadas) && c.reagendadas.includes(dateStr)) {
            wasReag = true;
          }

          /* Check if practicante has a bloqueo on this specific date+hour */
          var hasBloq = dt.bloqueos.some(function(b) {
            return b.date === dateStr && b.hour === h && b.pIds.includes(c.practicanteId);
          });

          if (wasReag) {
            /* Show as reagendada */
            var color = PRAC_COLORS[c.practicanteId] || { bg: "#ccc", text: "#000" };
            grid[h].push({ dayIdx: dayIdx, label: initials + "-REAG", color: { bg: "#d8b4fe", text: "#581c87" }, type: "reagendada" });
            usedHours[h] = true;
          } else if (hasBloq) {
            /* Don't show - practicante is blocked */
          } else {
            var asuetoDates = asuetos.map(function(a) { return a.date; });
            var reagCount = 0;
            if (Array.isArray(c.reagendadas)) {
              reagCount = c.reagendadas.filter(function(rd) {
                return new Date(rd + "T12:00:00") < calDate;
              }).length;
            } else if (typeof c.reagendadas === "number") {
              reagCount = c.reagendadas;
            }
            var sessionLbl = getSessionLabel(c.firstDate, dateStr, reagCount, asuetoDates);
            var color2 = PRAC_COLORS[c.practicanteId] || { bg: "#ccc", text: "#000" };
            var onlineSuffix = al && al.enLinea ? "*" : "";
            grid[h].push({ dayIdx: dayIdx, label: initials + "-" + sessionLbl + onlineSuffix, color: color2, type: "cita" });
            usedHours[h] = true;
          }
        });

        var bloqs = dt.bloqueos.filter(function(b) { return b.date === dateStr && b.hour === h; });
        bloqs.forEach(function(b) {
          var typeLabel = b.type === "taller" ? "TALLER" : "MENTORÍA";
          var nameInit = getInitials(b.name);
          var sessionTxt = "";
          if (b.session) {
            var s = b.session.replace(/\s+/g, "").replace(/-/g, "");
            var gpoMatch = s.match(/[Gg]po(\d+)/i);
            var sesMatch = s.match(/[Ss](\d+)/);
            if (gpoMatch) sessionTxt += "GPO" + gpoMatch[1].padStart(2, "0");
            if (gpoMatch && sesMatch) sessionTxt += " ";
            if (sesMatch) sessionTxt += "S" + sesMatch[1];
            if (!gpoMatch && !sesMatch) sessionTxt = b.session;
          }
          var label = typeLabel + " " + nameInit;
          if (sessionTxt) label += " " + sessionTxt;
          var firstPid = b.pIds[0];
          var color = PRAC_COLORS[firstPid] || { bg: "#888", text: "#fff" };
          grid[h].push({ dayIdx: dayIdx, label: label, color: color, type: "bloqueo" });
          usedHours[h] = true;
        });
      });
    });
    return { grid: grid, activeHours: HOURS.filter(function(h) { return usedHours[h]; }) };
  }

  function drawCalCanvas(canvas, dayHeaders, activeHrs, grid, dt) {
    var COL_W = 240;
    var HOUR_W = 80;
    var ROW_H = 38;
    var HDR_H = 44;
    var LEGEND_H = 36;
    var W = HOUR_W + COL_W * 5;
    var H = LEGEND_H + HDR_H + ROW_H * activeHrs.length;
    canvas.width = W;
    canvas.height = H;
    var ctx = canvas.getContext("2d");

    /* Background */
    ctx.fillStyle = "#fff";
    ctx.fillRect(0, 0, W, H);

    /* Legend row */
    var lx = 8;
    ctx.font = "bold 12px Arial, sans-serif";
    dt.practicantes.forEach(function(p) {
      var co = PRAC_COLORS[p.id] || { bg: "#ccc", text: "#000" };
      var name = p.name.split(" ")[0];
      var tw = ctx.measureText(name).width + 16;
      ctx.fillStyle = co.bg;
      roundRect(ctx, lx, 6, tw, 24, 4);
      ctx.fill();
      ctx.fillStyle = co.text;
      ctx.fillText(name, lx + 8, 23);
      lx += tw + 6;
    });
    /* Online legend */
    ctx.font = "bold 11px Arial, sans-serif";
    ctx.fillStyle = "#0891b2";
    ctx.textAlign = "left";
    ctx.fillText("* = En línea", lx + 10, 23);

    var oY = LEGEND_H;

    /* Header row */
    ctx.fillStyle = "#e5e7eb";
    ctx.fillRect(0, oY, W, HDR_H);
    ctx.strokeStyle = "#9ca3af";
    ctx.lineWidth = 1;
    ctx.strokeRect(0, oY, HOUR_W, HDR_H);
    ctx.font = "bold 14px Arial, sans-serif";
    ctx.fillStyle = "#111";
    for (var di = 0; di < 5; di++) {
      var x = HOUR_W + di * COL_W;
      ctx.strokeRect(x, oY, COL_W, HDR_H);
      ctx.fillStyle = "#111";
      ctx.textAlign = "center";
      ctx.fillText(dayHeaders[di], x + COL_W / 2, oY + 28);
    }

    /* Rows */
    for (var ri = 0; ri < activeHrs.length; ri++) {
      var h = activeHrs[ri];
      var y = oY + HDR_H + ri * ROW_H;

      /* Hour label */
      ctx.fillStyle = "#f9fafb";
      ctx.fillRect(0, y, HOUR_W, ROW_H);
      ctx.strokeStyle = "#9ca3af";
      ctx.strokeRect(0, y, HOUR_W, ROW_H);
      ctx.fillStyle = "#374151";
      ctx.font = "bold 12px Arial, sans-serif";
      ctx.textAlign = "right";
      ctx.fillText(fmtH12(h), HOUR_W - 8, y + 24);

      /* Day cells */
      for (var dj = 0; dj < 5; dj++) {
        var cx = HOUR_W + dj * COL_W;
        ctx.fillStyle = "#fff";
        ctx.fillRect(cx, y, COL_W, ROW_H);
        ctx.strokeStyle = "#9ca3af";
        ctx.strokeRect(cx, y, COL_W, ROW_H);

        var items = grid[h].filter(function(item) { return item.dayIdx === dj; });
        if (items.length > 0) {
          var itemW = (COL_W - 6 - (items.length - 1) * 3) / items.length;
          for (var k = 0; k < items.length; k++) {
            var it = items[k];
            var ix = cx + 3 + k * (itemW + 3);
            var iy = y + 4;
            var ih = ROW_H - 8;

            ctx.fillStyle = it.color.bg;
            roundRect(ctx, ix, iy, itemW, ih, 4);
            ctx.fill();

            ctx.fillStyle = it.color.text;
            var fontSize = it.type === "bloqueo" ? 9 : 12;
            ctx.font = "bold " + fontSize + "px Arial, sans-serif";
            ctx.textAlign = "center";

            var maxTextW = itemW - 6;
            var txt = it.label;
            if (ctx.measureText(txt).width > maxTextW && txt.length > 8) {
              txt = txt.slice(0, Math.max(6, Math.floor(txt.length * maxTextW / ctx.measureText(txt).width))) + "…";
            }
            ctx.fillText(txt, ix + itemW / 2, iy + ih / 2 + fontSize / 3);
          }
        }
      }
    }
  }

  function roundRect(ctx, x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
  }

  function downloadCalPNG() {
    var weekDates = getWeekDates(calMonday);
    var dayHeaders = weekDates.map(function(dateStr, i) {
      var d = new Date(dateStr + "T12:00:00");
      return DAYS[i] + " " + d.getDate();
    });
    var calItems = buildCalItems(weekDates, active, data);
    var canvas = document.createElement("canvas");
    drawCalCanvas(canvas, dayHeaders, calItems.activeHours, calItems.grid, data);
    canvas.toBlob(function(blob) {
      var url = URL.createObjectURL(blob);
      var a = document.createElement("a");
      a.href = url;
      a.download = "calendario_dop_" + calMonday + ".png";
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      toast("Imagen descargada");
    });
  }

  function genAgendaSemanal(pracId) {
    var pr = data.practicantes.find(function(p) { return p.id === pracId; });
    if (!pr) return "";
    var citasPrac = active.filter(function(c) { return c.practicanteId === pracId; });
    if (citasPrac.length === 0) return pr.name + " no tiene pacientes asignados esta semana.";

    var lines = ["📋 Agenda semanal — " + pr.name, ""];
    DAYS.forEach(function(d) {
      var citasDia = citasPrac.filter(function(c) { return c.day === d; }).sort(function(a, b) { return parseInt(a.hour) - parseInt(b.hour); });
      if (citasDia.length > 0) {
        lines.push(d.toUpperCase() + ":");
        citasDia.forEach(function(c) {
          var al = data.alumnos.find(function(a) { return a.id === c.alumnoId; });
          if (al) {
            var onlineTxt = al.enLinea ? " [En línea]" : "";
            lines.push("\u2022 " + fmtH12(c.hour) + " — " + al.name + " (" + al.matricula + ")" + onlineTxt);
          }
        });
        lines.push("");
      }
    });
    return lines.join("\n");
  }

    var citasCancel = getCitasForDate(cancelDiaFecha);

    var affectedIds = {};
    citasCancel.forEach(function(c) { affectedIds[c.id] = true; });

      if (!affectedIds[c.id]) return c;
      var arr = Array.isArray(c.reagendadas) ? c.reagendadas.slice() : [];
      if (!arr.includes(cancelDiaFecha)) arr.push(cancelDiaFecha);
      return { ...c, reagendadas: arr };

    setCancelDiaApplied(true);

    return [];

/* ── HISTORIAL ── */

function HistorialTab({ data, onSave, toast }) {
  const [filter, setFilter] = useState("todos");
  const [filterPrac, setFilterPrac] = useState("");
  const [search, setSearch] = useState("");

  var statusLabels = { alta: "Alta", canalizada: "Canalizada", baja_manual: "Baja", baja_faltas: "Baja por faltas", sin_cupo: "Sin cupo", reactivada: "Reactivada" };
  var statusIcons = { alta: "🟢", canalizada: "🔵", baja_manual: "🔴", baja_faltas: "🔴", sin_cupo: "⚪", activa: "✅", reactivada: "🟡" };

  function reactivar(alumnoId) {
    var updatedCitas = data.citas.map(function(c) {
      if (c.alumnoId !== alumnoId) return c;
      if (!c.active && (c.status === "alta" || c.status === "baja_manual" || c.status === "baja_faltas" || c.status === "canalizada")) {
        return { ...c, status: "reactivada" };
      }
      return c;
    });
    onSave({ ...data, citas: updatedCitas });
    toast("Paciente reactivado — ya puede recibir cita nueva");
  }

  /* Build unique records: one per alumno, most relevant cita */
  var records = useMemo(function() {
    var result = [];
    data.alumnos.forEach(function(al) {
      var citasAlumno = data.citas.filter(function(c) { return c.alumnoId === al.id; });
      var activeCita = citasAlumno.find(function(c) { return c.active; });

      if (activeCita) {
        var pr = data.practicantes.find(function(p) { return p.id === activeCita.practicanteId; });
        result.push({
          alumno: al, cita: activeCita, practicante: pr,
          estado: "activa", faltas: activeCita.faltas || 0, reagendadas: activeCita.reagendadas || 0
        });
      } else if (citasAlumno.length > 0) {
        /* Most recent inactive cita */
        var sorted = citasAlumno.slice().sort(function(a, b) { return a.firstDate > b.firstDate ? -1 : 1; });
        var lastCita = sorted[0];
        var pr2 = data.practicantes.find(function(p) { return p.id === lastCita.practicanteId; });
        result.push({
          alumno: al, cita: lastCita, practicante: pr2,
          estado: lastCita.status || "baja_manual", faltas: lastCita.faltas || 0, reagendadas: lastCita.reagendadas || 0
        });
      } else {
        /* Sin cita = sin cupo */
        result.push({
          alumno: al, cita: null, practicante: null,
          estado: "sin_cupo", faltas: 0, reagendadas: 0
        });
      }
    });
    return result;
  }, [data]);

  var filtered = records.filter(function(r) {
    if (filter !== "todos") {
      if (filter === "activas" && r.estado !== "activa") return false;
      if (filter === "inactivas" && r.estado === "activa") return false;
      if (filter === "alta" && r.estado !== "alta") return false;
      if (filter === "baja" && r.estado !== "baja_manual" && r.estado !== "baja_faltas") return false;
      if (filter === "canalizada" && r.estado !== "canalizada") return false;
      if (filter === "sin_cupo" && r.estado !== "sin_cupo") return false;
    }
    if (filterPrac) {
      if (!r.cita || r.cita.practicanteId !== filterPrac) return false;
    }
    if (search) {
      var q = search.toLowerCase();
      if (!r.alumno.name.toLowerCase().includes(q) && !r.alumno.matricula.includes(q)) return false;
    }
    return true;
  });

  function cleanCell(text) {
    if (text === null || text === undefined) return "";
    return String(text).replace(/[\t\n\r]+/g, " ").replace(/"/g, "'").trim();
  }

  function downloadExcel() {
    var headers = ["Nombre", "Matrícula", "Carrera", "Motivo de consulta", "Modalidad", "Practicante", "Día", "Hora", "Estado", "Faltas", "Reagendadas"];
    var rows = [headers.join(",")];
    var list = filterPrac ? filtered : records;
    list.forEach(function(r) {
      var estadoTxt = r.estado === "activa" ? "Activa" : (statusLabels[r.estado] || "Inactiva");
      var row = [
        '"' + cleanCell(r.alumno.name) + '"',
        cleanCell(r.alumno.matricula),
        '"' + cleanCell(r.alumno.carrera) + '"',
        '"' + cleanCell(r.alumno.motivoConsulta) + '"',
        r.alumno.enLinea ? "En línea" : "Presencial",
        '"' + cleanCell(r.practicante ? r.practicante.name : "") + '"',
        cleanCell(r.cita ? r.cita.day : ""),
        cleanCell(r.cita ? fmtH12(r.cita.hour) : ""),
        estadoTxt,
        String(r.faltas),
        String(r.reagendadas)
      ];
      rows.push(row.join(","));
    });
    var csvContent = "\uFEFF" + rows.join("\n");
    var blob = new Blob([csvContent], { type: "text/csv;charset=utf-8;" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = "citas_dop_limpio.csv";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  }

  var countByStatus = {};
  records.forEach(function(r) {
    countByStatus[r.estado] = (countByStatus[r.estado] || 0) + 1;
  });

  return (
    <div>
      <div className="flex flex-wrap gap-2 mb-4 items-center">
        <input value={search} onChange={function(e) { setSearch(e.target.value); }} placeholder="Buscar paciente..." className="border border-gray-300 rounded-lg px-3 py-2 text-sm flex-1 min-w-[140px]" />
        <select value={filter} onChange={function(e) { setFilter(e.target.value); }} className="border border-gray-300 rounded-lg px-3 py-2 text-sm">
          <option value="todos">Todos ({records.length})</option>
          <option value="activas">✅ Activas ({countByStatus["activa"] || 0})</option>
          <option value="sin_cupo">⚪ Sin cupo ({countByStatus["sin_cupo"] || 0})</option>
          <option value="alta">🟢 Alta ({countByStatus["alta"] || 0})</option>
          <option value="baja">🔴 Baja ({(countByStatus["baja_manual"] || 0) + (countByStatus["baja_faltas"] || 0)})</option>
          <option value="canalizada">🔵 Canalizada ({countByStatus["canalizada"] || 0})</option>
        </select>
        <select value={filterPrac} onChange={function(e) { setFilterPrac(e.target.value); }} className="border border-gray-300 rounded-lg px-3 py-2 text-sm">
          <option value="">Todos</option>
          {data.practicantes.map(function(p) { return <option key={p.id} value={p.id}>{p.name.split(" ")[0]}</option>; })}
        </select>
        <button onClick={downloadExcel} className="px-3 py-2 rounded-lg text-white text-xs font-medium cursor-pointer" style={{ background: "#1F2A5C" }}>
          ⬇ citas_dop_limpio.csv
        </button>
      </div>

      <p className="text-xs text-gray-500 mb-3">{filtered.length} paciente(s) sin duplicados. El CSV se abre directo en Excel/Sheets.</p>

      <div className="space-y-1.5">
        {filtered.map(function(r, idx) {
          var prColor = r.cita ? (PRAC_COLORS[r.cita.practicanteId] || { bg: "#ccc" }) : { bg: "#ddd" };
          var icon = statusIcons[r.estado] || "⚪";
          var label = r.estado === "activa" ? "Activa" : (statusLabels[r.estado] || "—");
          return (
            <div key={r.alumno.id + "-" + idx} className={"border rounded-lg p-3 text-sm " + (r.estado === "activa" ? "border-gray-200" : "border-gray-100 bg-gray-50/50")}>
              <div className="flex items-center justify-between gap-2">
                <div className="flex items-center gap-2 min-w-0">
                  <span className="w-3 h-3 rounded-full shrink-0" style={{ background: prColor.bg }}></span>
                  <span className="font-semibold truncate" style={{ color: "#1F2A5C" }}>{r.alumno.name}</span>
                </div>
                <div className="flex items-center gap-2 shrink-0">
                  <span className="text-xs">{icon} {label}</span>
                  {(r.estado === "alta" || r.estado === "baja_manual" || r.estado === "baja_faltas" || r.estado === "canalizada") && (
                    <button onClick={function() { reactivar(r.alumno.id); }} className="px-2 py-1 text-xs rounded border border-yellow-300 text-yellow-700 hover:bg-yellow-50 cursor-pointer">Reactivar</button>
                  )}
                </div>
              </div>
              <div className="flex flex-wrap gap-3 mt-1 text-xs text-gray-500 ml-5">
                <span>{r.alumno.matricula}</span>
                <span className="truncate" style={{ maxWidth: 200 }}>{r.alumno.carrera}</span>
                {r.cita && <span>{r.cita.day} {fmtH12(r.cita.hour)}</span>}
                {r.practicante && <span>→ {r.practicante.name.split(" ")[0]}</span>}
                {r.faltas > 0 && <span className="text-red-500">{r.faltas} falta(s)</span>}
                {r.reagendadas > 0 && <span className="text-purple-500">{r.reagendadas} reag.</span>}
              </div>
            </div>
          );
        })}
      </div>
    </div>
  );
}

function App() {
  const [data, setData] = useState({ practicantes: [], alumnos: [], citas: [], bloqueos: [], asuetos: [] });
  const [loading, setLoading] = useState(true);
  const [tab, setTab] = useState("practicantes");
  const [toastMsg, setToastMsg] = useState("");
  const _dbRef = useRef(null);
  const _skipSnap = useRef(false);

  useEffect(function() {
    var unsubscribe = null;
    var loadTimer = null;

    async function init() {
      var db = window._firestoreDb || null;

      if (db) {
        _dbRef.current = db;
        var docRef = db.doc("config/main");

        loadTimer = setTimeout(function() {
          fallbackLoad();
        }, 10000);

        unsubscribe = docRef.onSnapshot(function(snap) {
          if (loadTimer) { clearTimeout(loadTimer); loadTimer = null; }
          if (_skipSnap.current) { _skipSnap.current = false; return; }
          if (snap.exists) {
            var d = JSON.parse(JSON.stringify(snap.data()));
            if (!d.practicantes) d.practicantes = [];
            if (!d.alumnos) d.alumnos = [];
            if (!d.citas) d.citas = [];
            if (!d.bloqueos) d.bloqueos = [];
            if (!d.asuetos) d.asuetos = [];
            setData(d);
          } else {
            var seed = { practicantes: INIT_PRACS, alumnos: [], citas: [], bloqueos: INIT_BLOQUEOS, asuetos: [] };
            docRef.set(seed).catch(function(e) { console.error("seed error:", e); });
            setData(seed);
          }
          setLoading(false);
        }, function(err) {
          console.error("db error:", err);
          if (loadTimer) { clearTimeout(loadTimer); loadTimer = null; }
          fallbackLoad();
        });
      } else {
        fallbackLoad();
      }
    }

    function fallbackLoad() {
      try {
        var val = localStorage.getItem(KEY);
        if (val) {
          setData(JSON.parse(val));
          setLoading(false);
          return;
        }
      } catch(e) {}
      var seed = { practicantes: INIT_PRACS, alumnos: [], citas: [], bloqueos: INIT_BLOQUEOS, asuetos: [] };
      setData(seed);
      try { localStorage.setItem(KEY, JSON.stringify(seed)); } catch(e) {}
      setLoading(false);
    }

    init();
    return function() { if (unsubscribe) unsubscribe(); if (loadTimer) clearTimeout(loadTimer); };
  }, []);

  var save = useCallback(async function(d) {
    setData(d);
    if (_dbRef.current) {
      _skipSnap.current = true;
      try { await _dbRef.current.doc("config/main").set(d); } catch(e) { console.error("save error:", e); }
    } else {
      try { localStorage.setItem(KEY, JSON.stringify(d)); } catch(e) {}
    }
  }, []);

  function showToast(m) { setToastMsg(m); }

  var stats = useMemo(function() {
    var a = data.citas.filter(function(c) { return c.active; });
    return { citas: a.length, als: data.alumnos.length, pracs: data.practicantes.length, bloqs: data.bloqueos.length };
  }, [data]);

  function resetAll() {

    var seed = { practicantes: INIT_PRACS, alumnos: [], citas: [], bloqueos: INIT_BLOQUEOS };
    save(seed);
    showToast("Datos reiniciados");
  }

  function exportData() {
    var json = JSON.stringify(data);
    var success = copyText(json);
    if (success) {
      showToast("Datos copiados al portapapeles — pégalos en una nota o mensaje");
    } else {
      showToast("No se pudo copiar");
    }
  }

  const [showImport, setShowImport] = useState(false);
  const [importText, setImportText] = useState("");

  var KARLA_ENTRY = {
    id: "karla", name: "Psic. Karla Mitzary Aguilar Reyes",
    schedule: {
      "Lunes": ["9:00","10:00","11:00","12:00","13:00","14:00","15:00"],
      "Martes": ["9:00","10:00","11:00","12:00","13:00","14:00","15:00"],
      "Miércoles": ["9:00","10:00","11:00","12:00","13:00","14:00","15:00"],
      "Jueves": ["9:00","10:00","11:00","12:00","13:00","14:00","15:00"],
      "Viernes": ["9:00","10:00","11:00","12:00","13:00","14:00","15:00"]
    }, propiaOficina: true
  };

  var KARLA_BLOQUEOS = [
    { id: "t03", type: "taller", name: "Métodos de Org. y Estudio", session: "Gpo2-S1", date: "2026-08-13", hour: "14:00", pIds: ["karla"] },
    { id: "t04", type: "taller", name: "Métodos de Org. y Estudio", session: "Gpo2-S2", date: "2026-08-20", hour: "14:00", pIds: ["karla"] },
    { id: "t07", type: "taller", name: "Manejo del Estrés", session: "Gpo2-S1", date: "2026-08-27", hour: "14:00", pIds: ["karla"] },
    { id: "t08", type: "taller", name: "Manejo del Estrés", session: "Gpo2-S2", date: "2026-09-03", hour: "14:00", pIds: ["karla"] },
    { id: "t11", type: "taller", name: "Inteligencia Emocional", session: "Gpo2-S1", date: "2026-09-10", hour: "14:00", pIds: ["karla"] },
    { id: "t12", type: "taller", name: "Inteligencia Emocional", session: "Gpo2-S2", date: "2026-09-17", hour: "14:00", pIds: ["karla"] },
    { id: "t14", type: "taller", name: "Ansiedad", session: "Gpo2-S1", date: "2026-09-24", hour: "14:00", pIds: ["karla"] },
    { id: "t16", type: "taller", name: "Depresión", session: "Gpo2-S1", date: "2026-10-15", hour: "14:00", pIds: ["karla"] },
    { id: "t18", type: "taller", name: "Duelo", session: "Gpo2-S1", date: "2026-10-22", hour: "14:00", pIds: ["karla"] },
    { id: "t20", type: "taller", name: "Amor Propio y Autoestima", session: "Gpo2-S1", date: "2026-10-29", hour: "14:00", pIds: ["karla"] }
  ];

  function ensureKarla(imported) {
    var hasKarla = imported.practicantes.some(function(p) { return p.id === "karla"; });
    if (!hasKarla) {
      imported.practicantes.unshift(KARLA_ENTRY);
    }
    var karlaBloqueoIds = KARLA_BLOQUEOS.map(function(b) { return b.id; });
    var existingIds = imported.bloqueos.map(function(b) { return b.id; });
    KARLA_BLOQUEOS.forEach(function(kb) {
      if (!existingIds.includes(kb.id)) {
        imported.bloqueos.push(kb);
      }
    });
    return imported;
  }

  function parseImport() {
    try {
      var imported = JSON.parse(importText);
      if (imported.practicantes && imported.alumnos && imported.citas && imported.bloqueos) {
        if (!imported.asuetos) imported.asuetos = [];
        imported = ensureKarla(imported);
        return imported;
      } else {
        showToast("Datos no válidos");
        return null;
      }
    } catch (err) {
      showToast("Error: texto no es JSON válido");
      return null;
    }
  }

  function doImportReplace() {
    var imported = parseImport();
    if (!imported) return;
    save(imported);
    setShowImport(false);
    setImportText("");
    showToast("Datos reemplazados correctamente");
  }

  function doImportMerge() {
    var imported = parseImport();
    if (!imported) return;

    var merged = JSON.parse(JSON.stringify(data));

    var existPracIds = merged.practicantes.map(function(p) { return p.id; });
    imported.practicantes.forEach(function(p) {
      if (!existPracIds.includes(p.id)) {
        merged.practicantes.push(p);
      }
    });

    var alumnoMap = {};
    merged.alumnos.forEach(function(a) { alumnoMap[a.id] = a; });
    imported.alumnos.forEach(function(a) {
      if (!alumnoMap[a.id]) {
        merged.alumnos.push(a);
        alumnoMap[a.id] = a;
      } else {
        var local = alumnoMap[a.id];
        if (!local.telefono && a.telefono) local.telefono = a.telefono;
        if (!local.email && a.email) local.email = a.email;
        if (!local.motivo && a.motivo) local.motivo = a.motivo;
      }
    });

    var citaMap = {};
    merged.citas.forEach(function(c) { citaMap[c.id] = c; });
    imported.citas.forEach(function(c) {
      if (!citaMap[c.id]) {
        merged.citas.push(c);
        citaMap[c.id] = c;
      } else {
        var local = citaMap[c.id];
        if ((c.faltas || 0) > (local.faltas || 0)) local.faltas = c.faltas;
        var localReag = Array.isArray(local.reagendadas) ? local.reagendadas : [];
        var impReag = Array.isArray(c.reagendadas) ? c.reagendadas : [];
        var allReag = localReag.slice();
        impReag.forEach(function(r) {
          if (!allReag.includes(r)) allReag.push(r);
        });
        allReag.sort();
        local.reagendadas = allReag;
        var statusOrder = { "activa": 0, "sin cupo": 1, "reagendada": 1, "reactivada": 2, "alta": 3, "baja": 3, "canalizada": 3 };
        var localOrd = statusOrder[local.status] || 0;
        var impOrd = statusOrder[c.status] || 0;
        if (impOrd > localOrd) {
          local.status = c.status;
          local.active = c.active;
        }
        if (!c.active && local.active && impOrd >= localOrd) {
          local.active = false;
          local.status = c.status;
        }
      }
    });

    var existBloqIds = merged.bloqueos.map(function(b) { return b.id; });
    imported.bloqueos.forEach(function(b) {
      if (!existBloqIds.includes(b.id)) {
        merged.bloqueos.push(b);
      }
    });

    if (!merged.asuetos) merged.asuetos = [];
    var existAsuIds = merged.asuetos.map(function(a) { return a.id; });
    (imported.asuetos || []).forEach(function(a) {
      if (!existAsuIds.includes(a.id)) {
        merged.asuetos.push(a);
      }
    });

    merged = ensureKarla(merged);
    save(merged);
    setShowImport(false);
    setImportText("");
    showToast("Datos combinados ✓");
  }

  if (loading) {
    return (
      <div className="flex items-center justify-center min-h-screen">
        <p className="text-sm text-gray-500">Cargando...</p>
      </div>
    );
  }

  var inactiveCount = data.citas.filter(function(c) { return !c.active; }).length;

  var tabs = [
    { id: "practicantes", icon: "👥", label: "Practicantes", n: stats.pracs },
    { id: "alumnos", icon: "🎓", label: "Alumnos", n: stats.als },
    { id: "bloqueos", icon: "🚫", label: "Bloqueos", n: stats.bloqs },
    { id: "asignar", icon: "📅", label: "Asignar", n: 0 },
    { id: "citas", icon: "📋", label: "Citas", n: stats.citas },
    { id: "historial", icon: "📊", label: "Historial", n: stats.als }
  ];

  return (
    <div className="min-h-screen" style={{ background: "#f7f8fa", fontFamily: "Inter, Segoe UI, system-ui, sans-serif" }}>
      <div className="text-white px-5 py-4" style={{ background: "linear-gradient(135deg, #1F2A5C, #2d3a7c)" }}>
        <div className="max-w-5xl mx-auto flex items-center justify-between">
          <div>
            <h1 className="text-lg font-bold tracking-tight">Sistema de Citas — DOP</h1>
            <p className="text-xs opacity-70 mt-0.5">Departamento de Orientación Psicopedagógica · FCFM-UANL</p>
          </div>
          <div className="text-xs opacity-80 text-right">
            <p>{stats.citas} cita(s) activa(s)</p>
            <p>{stats.bloqs} bloqueo(s)</p>
            <p>{_dbRef.current ? "\u2601\uFE0F Firebase" : "\uD83D\uDCBE Local"}</p>
          </div>
        </div>
      </div>

      <div className="border-b border-gray-200 bg-white sticky top-0 z-10">
        <div className="max-w-5xl mx-auto flex overflow-x-auto">
          {tabs.map(function(t) {
            var isActive = tab === t.id;
            return (
              <button key={t.id} onClick={function() { setTab(t.id); }}
                className={"flex items-center gap-1 px-3 py-3 text-sm font-medium border-b-2 cursor-pointer whitespace-nowrap " + (isActive ? "border-blue-600 text-blue-700" : "border-transparent text-gray-500 hover:text-gray-700")}>
                <span>{t.icon}</span>
                <span className="hidden sm:inline">{t.label}</span>
                {t.n > 0 && <span className="ml-1 px-1.5 py-0.5 rounded-full bg-gray-100 text-gray-600" style={{ fontSize: 10 }}>{t.n}</span>}
              </button>
            );
          })}
          <div className="ml-auto flex items-center gap-1 pr-2">
            <button onClick={exportData} className="text-xs text-gray-400 hover:text-blue-500 cursor-pointer px-2" title="Exportar datos">📤</button>
            <button onClick={function() { setShowImport(true); }} className="text-xs text-gray-400 hover:text-green-500 cursor-pointer px-2" title="Importar datos">📥</button>
            <ConfirmBtn onConfirm={resetAll} label="🔄" confirmLabel="¿Borrar todo?" />
          </div>
        </div>
      </div>

      <div className="max-w-5xl mx-auto px-4 py-5">
        {tab === "practicantes" && <PracticantesTab data={data} onSave={save} toast={showToast} />}
        {tab === "alumnos" && <AlumnosTab data={data} onSave={save} toast={showToast} />}
        {tab === "bloqueos" && <BloqueosTab data={data} onSave={save} toast={showToast} />}
        {tab === "asignar" && <AsignarTab data={data} onSave={save} toast={showToast} />}
        {tab === "citas" && <CitasTab data={data} onSave={save} toast={showToast} />}
        {tab === "historial" && <HistorialTab data={data} onSave={save} toast={showToast} />}
      </div>

      <Toast msg={toastMsg} onDone={function() { setToastMsg(""); }} />

      <Modal open={showImport} onClose={function() { setShowImport(false); }} title="Importar datos">
        <div className="space-y-3">
          <p className="text-sm text-gray-600">Pega aquí los datos que copiaste con 📤 desde otro dispositivo:</p>
          <textarea
            value={importText}
            onChange={function(e) { setImportText(e.target.value); }}
            className="w-full border border-gray-300 rounded-lg px-3 py-2 text-xs font-mono h-32"
            placeholder='Pega el texto aquí...'
          ></textarea>
          <div className="p-3 rounded-lg bg-blue-50 text-xs text-blue-800 space-y-1">
            <p className="font-semibold">¿Qué modo usar?</p>
            <p><strong>Combinar:</strong> Agrega alumnos, citas y bloqueos nuevos sin borrar lo que ya tienes. Si una cita existe en ambos, conserva la versión con más cambios (faltas, reagendadas, status).</p>
            <p><strong>Reemplazar:</strong> Borra todo lo actual y lo sustituye con los datos pegados.</p>
          </div>
          <div className="flex justify-end gap-3">
            <button onClick={function() { setShowImport(false); }} className="px-4 py-2 rounded-lg text-sm text-gray-600 hover:bg-gray-100 cursor-pointer">Cancelar</button>
            <button onClick={doImportReplace} className="px-4 py-2 rounded-lg text-white text-sm font-medium cursor-pointer bg-red-500 hover:bg-red-600">Reemplazar</button>
            <button onClick={doImportMerge} className="px-5 py-2 rounded-lg text-white text-sm font-medium cursor-pointer" style={{ background: "#1F2A5C" }}>Combinar ✓</button>
          </div>
        </div>
      </Modal>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<PasswordGate><App /></PasswordGate>);
  </script>
</body>
</html>
